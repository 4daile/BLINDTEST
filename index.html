<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blind Test des Intros</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="glow-bg">
    <span style="width:520px;height:520px;top:-120px;left:10%;background:#E8145B;"></span>
    <span style="width:420px;height:420px;top:20%;right:5%;background:var(--purple);"></span>
    <span style="width:380px;height:380px;bottom:-100px;left:20%;background:var(--blue);"></span>
    <span style="width:300px;height:300px;bottom:10%;right:15%;background:var(--green);opacity:0.4;"></span>
  </div>

  <main class="home">
    <h1 class="home-title">
      Blind Test<br />
      des Intr<span class="star">★</span>s
    </h1>

    <section class="rules">
      <h2>Règles du jeu&#8239:</h2>
      <p>Devinez chaque chanson (55) à l'aide de leur introduction.</p>

      <ul class="levels-list">
        <li class="rule-heading">4 niveaux sont proposés :</li>
        <li><span class="star">★</span> 0.4 seconde <span class="pts">(+4 pts)</span></li>
        <li><span class="star">★</span> 3 secondes <span class="pts">(+3 pts)</span></li>
        <li><span class="star">★</span> 5 secondes <span class="pts">(+2 pts)</span></li>
        <li><span class="star">★</span> Intro complète <span class="pts">(+1 pt)</span></li>
      </ul>
    </section>

    <a class="play-btn" href="question.html?q=1">Play</a>
  </main>

</body>
</html>
